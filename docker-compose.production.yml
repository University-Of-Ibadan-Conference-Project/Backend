version: '3.9'

services:
  backend:
    container_name: backend
    build:
      context: ./backend/
    volumes:
      - ./backend:/backend
      - /static:/static
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /tmp/acme_challenge:/tmp/acme_challenge
    command: >
      sh -c "
        python ./manage.py migrate --noinput &&
        python ./manage.py collectstatic --noinput &&
        daphne -b 0.0.0.0 -p 8000 conference.asgi:application
      "
    env_file:
      - ./.env
    ports:
      - 8000

  frontend:
    build:
      context: ./frontend/
    restart: on-failure
    ports:
      - 3000
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    command: >
      sh -c "npm start"
    env_file:
      - ./.env
    depends_on:
      - backend

  # Internal admin dashboard for managing registrations. It talks directly to
  # Firebase (not the Django backend), so it has no backend dependency. The
  # passcode is inlined at build time — set VITE_ADMIN_PASSCODE in ./.env.
  admin-manager:
    container_name: admin-manager
    build:
      context: ./admin-manager/
      args:
        VITE_ADMIN_PASSCODE: ${VITE_ADMIN_PASSCODE}
        ADMIN_BASE: /admin-manager/
    restart: on-failure
    ports:
      - 9000

  nginx:
    build:
      context: ./nginx/
      dockerfile: Dockerfile
    ports:
      - 80:80
      - 8000:8000
      - 443:443
    depends_on:
      - backend
      - frontend
      - admin-manager
    volumes:
      - ./backend:/backend
      - ./nginx:/etc/nginx/conf.d
      - /static:/static
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /tmp/acme_challenge:/tmp/acme_challenge

volumes:
  pgdata: {}
