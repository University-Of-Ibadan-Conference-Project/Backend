version: '3.9'

services:
  backend:
    container_name: backend
    build:
      context: ./backend/
    volumes:
      - ./backend:/backend
      - /static:/static
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /tmp/acme_challenge:/tmp/acme_challenge
    command: >
      sh -c "
        python ./manage.py migrate --noinput &&
        python ./manage.py collectstatic --noinput &&
        daphne -b 0.0.0.0 -p 8000 conference.asgi:application
      "
    env_file:
      - ./.env
    ports:
      - 8000

  frontend:
    build:
      context: ./frontend/
    restart: on-failure
    ports:
      - 3000
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    command: >
      sh -c "npm start"
    env_file:
      - ./.env
    depends_on:
      - backend

  # Reverse proxy / TLS is handled by the VPS Caddy on the external `web`
  # network, not by an in-project nginx. The admin dashboard has its own compose
  # file (admin-manager/docker-compose.yml) that joins the same `web` network.

volumes:
  pgdata: {}
