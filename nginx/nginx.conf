upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

upstream admin_manager {
    server admin-manager:9000;
}

server {
    listen 80;
    server_name uisc2023.org www.uisc2023.org;
    return 301 https://uisc2023.org.com$request_uri;
}

server  {
    listen 8000;
    listen [::]:8000 ssl http2;

    ssl_certificate /etc/letsencrypt/live/uisc2023.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uisc2023.org/privkey.pem;

    location / {
        proxy_pass https://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        autoindex on;
        alias /backend/static/;
    }

    location ~ /.well-known/acme-challenge {
        allow all;
        root /tmp/acme_challenge;
    }

}

server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    ssl_certificate /etc/letsencrypt/live/uisc2023.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uisc2023.org/privkey.pem;

    location / {
        proxy_pass http://frontend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /api {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /admin {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # Registrations admin dashboard (static SPA). The longer /admin-manager/
    # prefix takes precedence over /admin above, so the Django admin is
    # unaffected. The trailing slash on proxy_pass strips the prefix before
    # forwarding (the app is built with base=/admin-manager/).
    location = /admin-manager {
        return 301 /admin-manager/;
    }

    location /admin-manager/ {
        proxy_pass http://admin_manager/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

}